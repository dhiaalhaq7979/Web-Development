<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div class="display">
      <div id="history" class="history"></div>
      <div id="screen" class="screen">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="back">&#9003;</button>
      <button class="fn" data-value="%">%</button>
      <button class="op" data-value="/">&divide;</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
      <button class="op" data-value="*">&times;</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
      <button class="op" data-value="-">&minus;</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
      <button class="op" data-value="+">+</button>
      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
    <p class="back"><a href="../">&larr; All projects</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
